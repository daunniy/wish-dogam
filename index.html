<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="치이카와 도감">
<title>치이카와 위시 도감</title>
<script src="config.js"></script>
<script src="data/bundle.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
html,body{margin:0}
/* Layout: 폰 = iOS 앱(큰 제목, 검색바, 종류 칩, 2열 카드, 하단 블러 탭바) / PC = 굿즈샵 웹사이트(상단 헤더 탭 + 넓은 본문 + 큰 카드) */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --tint:#ff2d55; --tint-soft:rgba(255,45,85,.1); --on-tint:#ffffff;
  --green:#34c759; --green-soft:rgba(52,199,89,.12);
  --bar:rgba(249,249,249,.86); --photo:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  --side:rgba(236,236,240,.78); --win:#ffffff; --desk:#dcdde3; --win-edge:rgba(0,0,0,.14);
  --page:#fff6f8; --line:rgba(255,45,85,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --tint:#ff375f; --tint-soft:rgba(255,55,95,.18); --on-tint:#ffffff;
  --green:#30d158; --green-soft:rgba(48,209,88,.16);
  --bar:rgba(22,22,24,.86); --photo:#ffffff; --shadow:none;
  --side:rgba(44,44,48,.82); --win:#1e1e20; --desk:#111114; --win-edge:rgba(255,255,255,.12); --page:#111113; --line:rgba(255,255,255,.1); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --tint:#ff375f; --tint-soft:rgba(255,55,95,.18); --on-tint:#ffffff;
  --green:#30d158; --green-soft:rgba(48,209,88,.16);
  --bar:rgba(22,22,24,.86); --photo:#ffffff; --shadow:none;
  --side:rgba(44,44,48,.82); --win:#1e1e20; --desk:#111114; --win-edge:rgba(255,255,255,.12); --page:#111113; --line:rgba(255,255,255,.1); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:15px;line-height:1.4;letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:17px;height:17px}

.app{max-width:900px;margin:0 auto}
.side{display:none}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}

/* 툴바 (폰: 버튼줄 → 큰 제목 → 검색) */
.toolbar{display:grid;grid-template-columns:1fr auto;grid-template-areas:"x btns" "title title" "search search";gap:6px 4px;align-items:center}
.tb-btns{grid-area:btns;display:flex;gap:4px}
.tb-title{grid-area:title}
.tb-search{grid-area:search;margin-top:6px}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--tint);position:relative}
.iconbtn:active{background:var(--fill)}
.iconbtn .dot{position:absolute;top:5px;right:5px;min-width:15px;height:15px;border-radius:8px;background:var(--tint);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.subtitle{color:var(--label2);font-size:15px;margin:2px 0 0;font-variant-numeric:tabular-nums}
.subtitle b{color:var(--label);font-weight:700}

/* 요약 위젯 */
.widget{background:var(--card);border-radius:16px;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;box-shadow:var(--shadow)}
.widget > button{display:flex;flex-direction:column;gap:1px;min-width:0;text-align:left}
.widget .k{font-size:12px;color:var(--label2);font-weight:600;display:flex;align-items:center;gap:4px}
.widget .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.widget .wish .v{color:var(--tint)}
.widget .saved .v{color:var(--green)}
.widget .s{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget > button + button{border-left:.5px solid var(--sep);padding-left:12px}
@media (max-width:400px){.widget{padding:14px 12px;gap:8px}.widget .v{font-size:17px}.widget > button + button{padding-left:8px}}

/* 검색 */
.searchbar{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;color:var(--label2)}
.searchbar input{border:0;background:transparent;flex:1;min-width:0;outline:none;color:var(--label);font-size:16px}
.searchbar input::placeholder{color:var(--label2)}
.scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroll::-webkit-scrollbar{display:none}
.pill{flex:none;height:32px;padding:0 14px;border-radius:16px;background:var(--card);font-size:14px;font-weight:500;color:var(--label);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:5px}
.pill[aria-pressed="true"]{background:var(--label);color:var(--bg)}
.pill .n{font-size:12px;opacity:.5}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{height:28px;border-radius:7px;font-size:13px;font-weight:600;color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}

/* 그룹·카드 */
#list{display:flex;flex-direction:column;gap:22px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 8px;gap:8px}
.ghead h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em}
.ghead span{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.card.dim{opacity:.62}
.ph{aspect-ratio:1/1;max-width:100%;background:var(--photo);position:relative;display:grid;place-items:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5%;background:#fff}
.ph .mono{font-size:28px;font-weight:700;color:#c7c7cc}
.cat{position:absolute;top:8px;left:8px;height:22px;padding:0 8px;border-radius:11px;background:rgba(0,0,0,.05);color:#3a3a3c;font-size:11px;font-weight:600;display:flex;align-items:center}
.st{position:absolute;top:8px;right:8px;height:24px;padding:0 8px;border-radius:12px;display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;background:rgba(255,255,255,.94);color:#1c1c1e;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.st.pass{color:#248a3d}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.cn{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cp{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cp small{font-size:12px;font-weight:500;color:var(--label2);margin-left:4px}
.cm{font-size:12px;color:var(--label2)}
.ca{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.ab.icon{flex:0 0 34px}
.ab.go{min-width:0;white-space:nowrap}
.ab{flex:1;height:34px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;color:var(--label);min-width:0}
.ab.heart{background:var(--tint-soft);color:var(--tint)}
.ab.spear{background:var(--label);color:var(--bg)}
.ab.shield{background:var(--green-soft);color:var(--green)}
.hb{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:none;color:#8e8e93;z-index:1}
.hb svg.i{width:24px;height:24px;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.hb.pb{top:50px;width:34px;height:34px;right:8px;color:#248a3d;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.12)}.hb.pb svg.i{width:19px;height:19px;filter:none}.hb.pb[aria-pressed="true"]{background:#34c759;color:#fff}.hb.pb[aria-pressed="true"] svg.i{fill:none}
.ob{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.95);color:#aeaeb2;box-shadow:inset 0 0 0 1.5px #d1d1d6,0 1px 4px rgba(0,0,0,.1);z-index:1}
.ob svg.i{width:20px;height:20px}
.ob[aria-pressed="true"]{background:var(--pink,#e3809d);color:#fff;box-shadow:0 2px 6px rgba(217,112,143,.35)}
.card.own{box-shadow:0 0 0 2px #ecc3cf,var(--shadow)}
.ab.go.mk{color:var(--label)}
@media (prefers-reduced-motion:no-preference){.ob[aria-pressed="true"] svg.i{animation:pop .3s ease}}
.hb[aria-pressed="true"]{color:#ff2d55}.hb[aria-pressed="true"] svg.i{fill:currentColor}
.qb.hb{position:static;box-shadow:none;background:var(--fill);color:var(--label2)}.qb.hb[aria-pressed="true"]{background:var(--tint-soft);color:var(--tint)}
@media (prefers-reduced-motion:no-preference){.hb[aria-pressed="true"] svg.i{animation:pop .3s ease}@keyframes pop{50%{transform:scale(1.3)}}}
.more{font-size:13px;color:var(--tint);font-weight:600;white-space:nowrap}
.ab.undo{background:transparent;box-shadow:inset 0 0 0 1px var(--sep);color:var(--label2);font-weight:500}
.ab.go{background:transparent;box-shadow:inset 0 0 0 1px var(--sep);color:var(--tint);text-decoration:none}
.ca + .ca{padding-top:6px}
.st.wish{color:#ff2d55}
.rk{position:absolute;bottom:8px;left:8px;height:22px;min-width:22px;padding:0 7px;border-radius:11px;background:#1c1c1e;color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rk.top{background:#ff2d55}
.main > *{flex-shrink:0}
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sortwrap{display:inline-flex;align-items:center;gap:4px;color:var(--tint);font-weight:600;font-size:14px;min-width:0}
.sortwrap select{border:0;background:transparent;color:var(--tint);font-weight:600;font-size:14px;appearance:none;-webkit-appearance:none;outline:none;cursor:pointer;min-width:0}
.vseg{width:132px;flex:none}.vseg button{display:grid;place-items:center;color:var(--label2)}.vseg button[aria-pressed="true"]{color:var(--label)}
.art{position:absolute;inset:0}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5%;background:#fff}
.dexbar{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.dexbar .t{display:flex;justify-content:space-between;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}.dexbar .t b{color:var(--label);font-size:15px}
.meter{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--tint),#ff8fab);border-radius:4px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dx{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--photo);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.dx:not(.own):not(.wished) .art{filter:grayscale(1);opacity:.4}
.dx .no{position:absolute;left:6px;bottom:4px;font-size:10px;font-weight:700;color:#8e8e93;font-variant-numeric:tabular-nums}
.dx .ico{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.15);color:#1c1c1e}
.dx .ico.w{color:#ff2d55}.dx .ico svg.i{width:13px;height:13px}
.listv{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.lrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px;position:relative;cursor:pointer}
.lrow + .lrow::before{content:"";position:absolute;top:0;left:88px;right:0;border-top:.5px solid var(--sep)}
.lth{position:relative;width:64px;height:64px;border-radius:10px;background:var(--photo);overflow:hidden;box-shadow:inset 0 0 0 .5px var(--sep)}
.lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.lt .cn{font-size:14px}.lt .cp{font-size:15px}
.lrk{color:var(--tint);font-weight:700;margin-right:4px}
.qbs{display:flex;gap:6px}
.qb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--label)}
.qb.heart{background:var(--tint-soft);color:var(--tint)}.qb.spear{background:var(--label);color:var(--bg)}.qb.shield{background:var(--green-soft);color:var(--green)}
.qb svg.i{width:17px;height:17px}
.lst{font-size:11px;font-weight:700;padding:2px 7px;border-radius:9px;background:var(--fill);color:var(--label2);align-self:flex-start}
.lst.bought{background:var(--label);color:var(--bg)}.lst.wish{background:var(--tint-soft);color:var(--tint)}.lst.pass{background:var(--green-soft);color:var(--green)}
.spr{position:absolute;inset:5%;background-repeat:no-repeat;background-size:1000% 1000%}
.mbox{grid-column:1/-1;background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}.mbox b{color:#e5484d;font-size:17px}.mbox span{font-size:13px}.mbox small{font-size:11.5px;color:var(--label2)}
.mkt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mkt:empty{display:none}
.mb{height:44px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--label);font-size:14px;font-weight:600;text-decoration:none;box-shadow:inset 0 0 0 1px var(--sep)}
.lineup{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:14px;padding:14px}
.lh{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}.lh span{font-size:12px;color:var(--label2)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.lc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.lb{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--cc);overflow:hidden}
.lc.cur .lb{outline:2.5px solid var(--label);outline-offset:2px}
.lc:not(.own):not(.cur) .art{opacity:.85}
.lo{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:#1c1c1e}.lo.w{color:#ff2d55}.lo svg.i{width:12px;height:12px}
.ll{font-size:11.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.lc.cur .ll{color:var(--label);font-weight:700}
.av{--sz:22px;width:var(--sz);height:var(--sz);flex:none;border-radius:50%;background:conic-gradient(var(--cc) calc(var(--p)*1%),var(--fill2) 0);display:grid;place-items:center;padding:calc(var(--sz)*.1)}
.av img.face{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 calc(var(--sz)*.05) var(--card)}
.scroll.sers .pill{height:30px;font-size:13px}
.av i{width:100%;height:100%;border-radius:50%;background:var(--cc);color:#fff;font-style:normal;font-weight:800;font-size:calc(var(--sz)*.42);display:grid;place-items:center;box-shadow:0 0 0 calc(var(--sz)*.05) var(--card)}
.pill .av{margin-left:-8px}
.pg{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.pgt{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;font-variant-numeric:tabular-nums}
.pgt > b{font-size:17px}.pgt > span{font-size:13px;color:var(--label2)}.pgt > span b{color:var(--label);font-size:15px}
.meter.big{height:10px;border-radius:5px}.pg .meter i{background:var(--cc)}
.pgs{font-size:12px!important}
.mp{font-size:12px;font-weight:700;color:#e5484d;font-variant-numeric:tabular-nums}.mp small{font-weight:500;color:var(--label2);margin-left:4px}
.pill .pc{font-size:11px;font-weight:700;color:var(--tint);margin-left:2px}.pill[aria-pressed="true"] .pc{color:inherit;opacity:.8}
.ja{font-size:12px;color:var(--label2);text-align:center;margin:-10px 0 0;overflow-wrap:anywhere}
.so{color:#ff3b30;font-weight:600}

.ab:active{opacity:.6}

.empty{background:var(--card);border-radius:16px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:var(--shadow)}
.empty .ei{width:52px;height:52px;border-radius:50%;background:var(--tint-soft);color:var(--tint);display:grid;place-items:center}
.empty h3{font-size:17px;font-weight:700;margin:4px 0 0}
.empty p{margin:0;color:var(--label2);font-size:14px;max-width:34ch}
.plain-btn{height:40px;padding:0 16px;border-radius:10px;color:var(--tint);font-size:15px;font-weight:600}
.foot{font-size:12px;color:var(--label3);text-align:center;margin:4px 0 0}

/* 하단 탭바 (폰) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;color:#999;font-size:10.5px;font-weight:600;position:relative}
.tab[aria-current="page"]{color:var(--tint)}
.tab svg.i{width:26px;height:26px}
.tab .badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--tint);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* ───── PC: macOS 창 ───── */
@media (min-width:900px){
  /* PC = 굿즈샵 웹사이트: 상단 고정 헤더(로고+보관함 탭) + 가운데 넓은 본문 */
  body{background:var(--page);padding:0;margin:0;font-size:15px}
  .app{max-width:none;display:block}
  .side{display:flex;align-items:center;gap:28px;position:sticky;top:0;z-index:10;height:68px;
    padding:0 max(40px,calc((100vw - 1240px)/2 + 40px));background:color-mix(in srgb,var(--card) 90%,transparent);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .lights{display:none}
  .brand{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;letter-spacing:-.03em;color:var(--label);white-space:nowrap}
  .brand svg.i{width:24px;height:24px;color:var(--tint);fill:var(--tint)}
  .sgroup{display:flex}.slab{display:none}
  #sideTabs{display:flex;gap:4px}
  .sitem{display:flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:20px;font-size:15px;font-weight:600;color:var(--label2);white-space:nowrap}
  .sitem svg.i{width:19px;height:19px}
  .sitem .n{font-size:13px;font-weight:600;color:var(--label3);font-variant-numeric:tabular-nums}
  .sitem:hover{background:var(--fill);color:var(--label)}
  .sitem[aria-current="true"]{background:var(--tint);color:#fff}.sitem[aria-current="true"] .n{color:rgba(255,255,255,.8)}
  .side .sgroup:has(#sideCats),.sfoot{display:none}
  .main{max-width:1240px;margin:0 auto;padding:30px 40px 72px;gap:22px}
  .toolbar{grid-template-columns:minmax(0,1fr) 340px auto;grid-template-areas:"title search btns";gap:16px;align-items:center}
  .tb-search{margin:0}
  h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
  .subtitle{font-size:14.5px;margin-top:4px}
  .searchbar{height:44px;border-radius:22px;padding:0 16px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
  .searchbar input{font-size:15px}
  .iconbtn{width:44px;height:44px;border-radius:22px;background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--label)}
  .iconbtn:hover{color:var(--tint);box-shadow:0 0 0 1px var(--tint)}
  .iconbtn svg.i{width:21px;height:21px}
  .tb-btns{gap:8px}
  .widget{border-radius:20px;box-shadow:0 0 0 1px var(--line);padding:22px 26px;gap:20px}
  .widget .k{font-size:13.5px}.widget .v{font-size:28px}.widget .s{font-size:13px}
  .widget > button{border-radius:12px}
  .scroll,.tabbar{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
  .card{border-radius:18px;box-shadow:0 0 0 1px var(--line);transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-3px);box-shadow:0 0 0 1px var(--line),0 12px 28px rgba(255,45,85,.10)}
  .cb{padding:14px 16px 16px;gap:5px}
  .cn{font-size:15px;line-height:1.4}.cp{font-size:18px}.cp small{font-size:13px}
  .ab{height:38px;border-radius:12px;font-size:13.5px}
  .ghead h2{font-size:19px}
  .ghead{border-bottom:1px solid var(--line);margin-bottom:14px;padding-bottom:8px}
  .empty{box-shadow:0 0 0 1px var(--line);border-radius:20px}
  .toast{bottom:32px}
}

/* 시트 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94vh;overflow:auto;border-radius:14px 14px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{border-radius:12px;max-height:88vh;box-shadow:0 0 0 .5px var(--win-edge),0 30px 80px rgba(0,0,0,.35)}.grab{display:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.shead{position:sticky;top:0;z-index:2;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 8px 8px}
.shead h2{font-size:17px;font-weight:600;margin:0;text-align:center}
.shead .l{justify-self:start}.shead .r{justify-self:end;font-weight:600}
.shead button{height:36px;padding:0 10px;color:var(--tint);font-size:17px}
@media (min-width:700px){.shead{padding:10px 10px}.shead h2{font-size:14px}.shead button{font-size:14px;height:30px}}
.sbody{padding:0 16px;display:flex;flex-direction:column;gap:22px}
.hero{background:var(--photo);border-radius:14px;aspect-ratio:1/1;max-width:100%;width:min(100%,260px);margin:0 auto;position:relative;display:grid;place-items:center;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5%}
.hero .mono{font-size:15px;color:#8e8e93}
.group{display:flex;flex-direction:column;gap:6px}
.glab{font-size:13px;color:var(--label2);padding:0 16px}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;position:relative;width:100%}
.row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row > span{flex:none;font-size:16px}
.row input,.row select,.row textarea{flex:1;min-width:0;border:0;background:transparent;font-size:16px;text-align:right;outline:none;padding:11px 0;color:var(--label)}
.row textarea{text-align:left;resize:none;min-height:70px}
.row select{direction:rtl;color:var(--label2)}
.row.col{flex-direction:column;align-items:stretch}
.row.btnrow{color:var(--tint);font-size:16px;justify-content:center;cursor:pointer}
.row.btnrow.danger{color:#ff3b30}
.row.btnrow.armed{background:#ff3b30;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chip{height:30px;padding:0 12px;border-radius:15px;background:var(--fill);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--tint);color:#fff}
.sw{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.links{display:flex;gap:16px;justify-content:center}
.links a{color:var(--tint);font-size:15px;text-decoration:none}
.err{color:#ff3b30;font-size:13px;margin:0;padding:0 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:rgba(28,28,30,.92);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px);display:flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}.card{transition:transform .12s,box-shadow .15s}.card:active{transform:scale(.98)}}

.friends{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:2px 0}
.friends::-webkit-scrollbar{display:none}
.fr{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border-radius:12px;color:var(--label2)}
.fr .av{transition:transform .15s}
.fr .nm{font-size:11.5px;white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis}
.fr .pc{font-size:10.5px;font-weight:700;color:var(--tint);margin-top:-2px;font-variant-numeric:tabular-nums}
.fr[aria-pressed="true"]{color:var(--label)}.fr[aria-pressed="true"] .nm{font-weight:700}
.fr[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--label)}
.fbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.fbar::-webkit-scrollbar{display:none}
.fchip{flex:none;height:34px;padding:0 10px 0 14px;border-radius:17px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:4px;color:var(--label)}
.fchip .cv{width:14px;height:14px;opacity:.5}
.fchip.on{background:var(--tint);color:#fff;padding-right:4px}
.fchip .x{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:rgba(255,255,255,.25);margin-left:2px}
.fchip.rs{background:transparent;box-shadow:none;color:var(--tint);padding:0 8px}
#fOverlay.one .glab{display:none}
.pgrid{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 4px}
.pgrid .pill{box-shadow:0 0 0 .5px var(--sep);height:36px;font-size:14.5px}
@media (min-width:900px){
  .friends{flex-wrap:wrap;overflow:visible;gap:2px 0}
  .fr{width:78px;cursor:pointer}.fr:hover{background:var(--card)}
  .fr .nm{font-size:13px;max-width:74px}.fr .pc{font-size:12px}
  .fchip{height:40px;font-size:14.5px;padding:0 14px 0 18px;box-shadow:0 0 0 1px var(--line)}
  .fchip:hover{box-shadow:0 0 0 1px var(--tint)}
  .pgrid .pill{height:38px;font-size:14.5px}
}

/* ===== 귀여운 테마 (치이카와 공식샵 느낌: 크림 바탕 + 핑크 물방울, 둥근 글씨, 파스텔) ===== */
:root{--cream:#fffaf3;--dot:rgba(255,138,173,.16);--pink:#e3809d;--pink2:#f8e6ec;--pink3:#fcf3f5;--mint:#e3f7ee;--lemon:#fff5d6;--lav:#efe9ff;--brown:#6b4f45;--edge:#f2dde3;
  --tint:#d9708f;--tint-soft:#f8e8ed;--round:"Jua","Gowun Dodum",sans-serif;
  --font:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;--label:#4a3a36;--label2:#8a7a75}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cream:#1d1719;--dot:rgba(255,138,173,.07);--pink2:#3a2229;--pink3:#2a1c21;--mint:#1b2d25;--lemon:#2e2a1a;--lav:#26213a;--brown:#f3d9d0;--edge:#4a2c36;--label:#fff;--label2:rgba(235,235,245,.6);--tint-soft:#3a2229}}
:root[data-theme="dark"]{--cream:#1d1719;--dot:rgba(255,138,173,.07);--pink2:#3a2229;--pink3:#2a1c21;--mint:#1b2d25;--lemon:#2e2a1a;--lav:#26213a;--brown:#f3d9d0;--edge:#4a2c36;--label:#fff;--label2:rgba(235,235,245,.6);--tint-soft:#3a2229}
body{background-color:var(--cream);background-image:linear-gradient(180deg,var(--pink3) 0,var(--cream) 420px);background-repeat:no-repeat;letter-spacing:0}
h1,.brand,.widget .v,.cp,.sitem,.tab,.fchip,.pill,.shead h2,.ghead h2,.pgt > b,.empty h3,.cbig,.csh b,.cline b,.rk,.cat,.fr .nm,.ab{font-family:var(--round);font-weight:400!important;letter-spacing:0}
h1{color:var(--brown)}
h1::after{content:"";display:inline-block;width:.42em;height:.42em;margin-left:.25em;vertical-align:.35em;border-radius:50%;background:var(--pink);box-shadow:.55em .1em 0 -.08em #f2d58f}
.subtitle b{font-family:var(--round);font-weight:400}
/* 요약: 파스텔 세 칸 */
.widget{background:transparent;box-shadow:none!important;padding:0!important;gap:10px}
.widget > button{background:var(--pink3);border:2px dashed var(--edge);border-radius:20px!important;padding:14px 14px 12px}
.widget .bought{background:var(--lemon);border-color:#f5dfa0}
.widget .saved{background:var(--mint);border-color:#b9e8d0}
.widget .k{font-weight:400;color:var(--label2)}
.widget .wish .v{color:var(--pink)}
/* 카드 */
.card{border:2px solid var(--edge);border-radius:22px;box-shadow:none}
.ph{margin:8px 8px 0;border-radius:16px;overflow:hidden;background:#fff}
.cat{background:var(--pink2);color:#b8607b;font-size:11.5px;border-radius:999px;top:7px;left:7px}
.cn{font-weight:400;color:var(--label)}
.cp{color:var(--pink)}
.cp small{font-family:var(--font)}
.ab{border-radius:999px!important}
.ab.go{box-shadow:none;background:var(--pink);color:#fff}
.ab.go.mk{background:#fff;color:var(--brown);box-shadow:inset 0 0 0 1.5px var(--edge)}
.ab.cb2{flex:none;width:38px;padding:0;background:var(--pink3);color:var(--pink);box-shadow:inset 0 0 0 1.5px var(--edge)}
.ab.cb2[aria-pressed="true"]{background:var(--pink);color:#fff;box-shadow:none}
.ab.cb2[aria-pressed="true"] svg.i{animation:pop .3s ease}
.qb.cartq[aria-pressed="true"]{background:var(--pink);color:#fff}
.hb{color:#c9b7b2}.hb[aria-pressed="true"]{color:var(--pink)}
/* 칩·필터 */
.fchip{border:2px solid var(--edge);box-shadow:none!important;color:var(--brown)}
.fchip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.fchip.rs{border:0}
.pill{border:2px solid var(--edge);box-shadow:none!important}
.pill[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.fr[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--cream),0 0 0 4.5px var(--pink)}
.fr .pc{color:var(--pink)}
.pg,.empty{border:2px solid var(--edge);box-shadow:none!important;border-radius:22px}
.seg{border-radius:999px}.seg button{border-radius:999px}
.sortwrap select{font-family:var(--round)}
/* 하단 탭바: 떠 있는 둥근 바 */
.tabbar{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:2px solid var(--edge);border-radius:26px;background:color-mix(in srgb,var(--card) 92%,transparent);padding-bottom:4px!important}
.tab[aria-current="true"],.tab[aria-pressed="true"]{color:var(--pink)}
/* 시트 */
.sheet{background:var(--cream)}.shead{background:var(--cream)}
.shead h2{font-size:19px;color:var(--brown)}
/* 장바구니 */
.cartsheet .sbody{padding:4px 16px 8px;display:flex;flex-direction:column;gap:14px}
.cshop{background:var(--card);border:2px solid var(--edge);border-radius:20px;padding:6px 12px 4px}
.csh{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 6px;border-bottom:2px dashed var(--edge)}
.csh b{font-size:16px;color:var(--brown)}.csh span{font-size:13px;color:var(--label2)}
.crow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--edge)}.crow:last-child{border-bottom:0}
.cth{position:relative;width:64px;height:64px;flex:none;border-radius:14px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1.5px var(--edge)}
.ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ct .cn{font-size:14px;-webkit-line-clamp:2}.ct .cp{font-size:15px}.ct .cm{font-size:12px;color:var(--label2)}
.cacts{display:flex;gap:4px;flex:none}
.cbt{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--pink3);color:var(--pink);font-size:13px}
.cbt.pass{background:var(--mint);color:#2f9e63}.cbt.rm{background:var(--fill);color:var(--label2)}
.csum{background:var(--card);border:2px solid var(--edge);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.cline{display:flex;justify-content:space-between;align-items:baseline}.cline span{color:var(--label2)}.cline b{font-size:24px;color:var(--pink)}
.chint{margin:0;font-size:13px;color:#2f9e63;display:flex;align-items:center;gap:5px}.chint b{font-family:var(--round);font-weight:400}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.cbig{height:46px;border-radius:999px;font-size:16px}
.cbig.pass{background:var(--mint);color:#2f9e63;box-shadow:inset 0 0 0 2px #b9e8d0}
.cbig.own{background:var(--pink);color:#fff}
.cempty{text-align:center;padding:40px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cempty .ei{width:60px;height:60px;border-radius:50%;background:var(--pink2);color:var(--pink);display:grid;place-items:center}
.cempty h3{font-family:var(--round);font-weight:400;font-size:19px;margin:6px 0 0;color:var(--brown)}.cempty p{margin:0;color:var(--label2);font-size:14px;line-height:1.6}
@media (max-width:520px){.ca{gap:4px}.ab{font-size:12.5px;height:32px}.ab.cb2{width:32px}.widget{gap:6px}.widget > button{padding:11px 10px 9px;border-radius:16px!important}.widget .v{font-size:17px}.widget .k{font-size:11.5px}}
@media (min-width:900px){
  body{background-color:var(--cream)}
  .side{background:var(--card);border-bottom:0;height:72px;box-shadow:0 2px 0 var(--edge)}
  .side::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:radial-gradient(circle at 10px -2px,var(--card) 9px,var(--edge) 9.5px,var(--edge) 11px,transparent 11.5px) 0 0/20px 12px repeat-x;pointer-events:none}
  .brand{font-size:24px;color:var(--brown)}
  .sitem{height:42px;font-size:16px;color:var(--brown)}
  .sitem[aria-current="true"]{background:var(--pink);color:#fff}
  .sitem:hover{background:var(--pink3)}
  .main{padding-top:40px}
  h1{font-size:34px}
  .searchbar,.iconbtn{box-shadow:none;border:2px solid var(--edge)}
  .iconbtn{color:var(--pink)}
  .iconbtn:hover{box-shadow:none;border-color:var(--pink)}
  .widget > button{padding:20px 22px 16px}
  .card{border-radius:24px;box-shadow:none}
  .card:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 10px 0 -4px var(--edge)}
  .fchip,.pill{box-shadow:none}
  .fchip:hover{border-color:var(--pink);box-shadow:none}
  .pg,.empty{box-shadow:none}
  .sheet{border:2px solid var(--edge)}
}

/* 로그인 시트 */
#userBtn.on{color:#fff;background:var(--pink)}
#userBtn.on svg.i{color:#fff}
.usheet .sbody{padding:4px 16px 12px;display:flex;flex-direction:column;gap:14px}
.uhead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px 0}
.uav{width:64px;height:64px;border-radius:50%;background:var(--pink2);color:var(--pink);display:grid;place-items:center}.uav svg.i{width:32px;height:32px}
.uav.on{background:var(--pink);color:#fff}
.uhead h3{font-family:var(--round);font-weight:400;font-size:20px;margin:4px 0 0;color:var(--brown);word-break:break-all}
.uhead p{margin:0;color:var(--label2);font-size:14px;line-height:1.6}
.ubox{background:var(--card);border:2px solid var(--edge);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ubox b{font-family:var(--round);font-weight:400;font-size:16px;color:var(--brown)}.ubox p{margin:0;font-size:13.5px;color:var(--label2)}
.ubox input[type=email],.ubox input[type=password]{height:46px;border-radius:14px;border:2px solid var(--edge);background:var(--cream);padding:0 14px;font-size:16px;outline:none}
.ubox input:focus{border-color:var(--pink)}
.ubtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ubtn{height:46px;border-radius:999px;background:var(--pink);color:#fff;font-family:var(--round);font-size:16px;display:grid;place-items:center;cursor:pointer}
.ubtn.ghost{background:var(--pink3);color:var(--pink);box-shadow:inset 0 0 0 2px var(--edge)}
.uerr{color:#e5484d!important;font-size:13.5px}
.uav.big{width:96px;height:96px;background:#fff;box-shadow:0 0 0 3px var(--edge)}.uav.big img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.ulink{color:var(--label2);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px;align-self:center}
.ubk{background:var(--card);border:2px solid var(--edge);border-radius:20px;padding:12px 16px}.ubk summary{cursor:pointer;color:var(--label2);font-size:14px}.ubk .ubtns{margin-top:10px}
.uhead h3{font-size:22px}
.gbtn{height:50px;border-radius:999px;background:#fff;color:#3c3c3c;box-shadow:inset 0 0 0 2px var(--edge);display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--round);font-size:17px;cursor:pointer}
.kbtn{height:50px;border-radius:999px;background:#FEE500;color:#191919;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--round);font-size:17px;cursor:pointer;margin-top:8px;width:100%}
.gbtn:hover{box-shadow:inset 0 0 0 2px var(--pink)}
.uor{display:flex;align-items:center;gap:10px;color:var(--label2);font-size:13px;margin:-4px 4px}.uor::before,.uor::after{content:"";flex:1;border-top:1.5px dashed var(--edge)}

/* 등장 애니메이션 */
#list .rv{opacity:0;transform:translateY(22px) scale(.97)}
#list .rv.in{opacity:1;transform:none;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.25,1.15)}
.prem{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#f8e6ec;color:#b8607b;font-size:11.5px;font-weight:700;font-family:var(--round,inherit)}

/* 배경음악 */
.bgm-btn{position:fixed;left:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:16;width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;font-size:19px;opacity:.92;box-shadow:0 4px 14px rgba(217,112,143,.28);display:grid;place-items:center}
.bgm-btn.on{animation:bgmspin 3s linear infinite}
@keyframes bgmspin{to{transform:rotate(360deg)}}
.bgm-panel{position:fixed;left:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:16;background:var(--card);border:2px solid var(--edge);border-radius:18px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.bgm-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--round);font-size:14px;color:var(--brown);padding:0 4px 6px}
.bgm-head button{color:var(--pink);font-size:13px}
.bgm-frame iframe{display:block;width:240px;height:200px;border:0;border-radius:12px}
@media (min-width:900px){.bgm-btn{bottom:28px;left:28px}.bgm-panel{bottom:84px;left:28px}}

/* 가격 표시 */
.cp{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;color:var(--brown,#4a3a36)!important;line-height:1.2}
.cp .won{font-family:var(--round,inherit);font-weight:400;font-size:19px;letter-spacing:-.01em;color:var(--brown,#4a3a36);font-variant-numeric:tabular-nums}
.cp .won em{font-style:normal;font-size:.72em;margin-left:1px;color:var(--label2)}
.cp .orig{font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--label2);background:var(--fill);padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.cp .np{font-family:var(--font);font-size:13px;font-weight:400;color:var(--label3,#aaa)}
.mrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:1px}
.mp{display:inline-flex;align-items:baseline;gap:4px;font-size:11.5px!important;font-weight:600!important;color:#9a6a3a!important;background:#fbf1e3;padding:2px 8px;border-radius:999px}
.mp small{font-size:10.5px;color:#b59473;margin:0!important}
.prem{margin-left:0!important}
.mp{white-space:nowrap}
@media (max-width:520px){.mp small{display:none}.cp .won{font-size:18px}}
@media (min-width:900px){.cp .won{font-size:20px}}
</style>

<script>
/* ===== 저장소 + 로그인 (브라우저 저장, Supabase 로그인 시 계정 동기화) ===== */
(function(){
const CFG=window.DOGAM_CONFIG||{};
const LS="wishdogam-store-v2", RATE_LS="wishdogam-rate-v1";
const hasSB=!!(CFG.supabaseUrl&&CFG.supabaseKey);
let store=null; // {wishes:{id:doc}}
try{store=JSON.parse(localStorage.getItem(LS))}catch(e){}
const subs=new Set();
let sb=null, session=null, pushT=null, syncState="";

function persist(){try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){toastSafe("브라우저 저장 공간이 꽉 찼어요")}}
function toastSafe(m){try{toast(m)}catch(e){}}
function snap(){const docs=Object.values(store.wishes).filter(d=>!d._deleted).map(d=>({id:d.id,data:()=>d}));return {docs,metadata:{fromCache:false}}}
function emit(){const s=snap();subs.forEach(f=>{try{f(s)}catch(e){console.error(e)}})}
function changed(){persist();emit();schedulePush()}
const genId=()=>"my-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

async function seed(){
  if(store&&store.wishes)return;
  store={wishes:{}};
  try{((window.DOGAM_DATA||{}).extra||[]).forEach(d=>{store.wishes[d.id]={...d,_t:0}})}catch(e){}
  persist();
}
const ready=seed();

const db={
  collection(){return {
    doc(id){return {
      async set(o){store.wishes[id]={...o,id,_t:Date.now()};changed()},
      async update(o){const cur=store.wishes[id]||{id};store.wishes[id]={...cur,...o,id,_t:Date.now()};changed()},
      async delete(){if(store.wishes[id]){store.wishes[id]={id,_deleted:true,_t:Date.now()};changed()}}
    }},
    async add(o){const id=genId();store.wishes[id]={...o,id,_t:Date.now()};changed();return {id}},
    onSnapshot(f){subs.add(f);setTimeout(()=>f(snap()),0);return()=>subs.delete(f)}
  }},
  doc(){return {onSnapshot(f){
    let r=null;try{r=JSON.parse(localStorage.getItem(RATE_LS))}catch(e){}
    const give=v=>f({exists:!!v,data:()=>v||{}});
    give(r);
    const today=new Date().toISOString().slice(0,10);
    if(!r||r.day!==today){
      fetch("https://open.er-api.com/v6/latest/KRW").then(x=>x.json()).then(j=>{
        if(!j||!j.rates)return;
        const v={jpyRate:+(1/j.rates.JPY).toFixed(2),cnyRate:+(1/j.rates.CNY).toFixed(1),rateDate:today.replace(/-/g,"."),day:today};
        try{localStorage.setItem(RATE_LS,JSON.stringify(v))}catch(e){}
        give(v);
      }).catch(()=>{});
    }
    return()=>{};
  }}}
};

/* 사진: 작게 줄여서 글자(data URL)로 저장 */
const assets={async upload(file){
  const url=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(file)});
  const img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url});
  const m=Math.min(1,600/Math.max(img.width,img.height));const c=document.createElement("canvas");
  c.width=Math.round(img.width*m);c.height=Math.round(img.height*m);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return {id:c.toDataURL("image/jpeg",.82)};
}};

window.claude={use:async k=>{await ready;return k==="db"?db:k==="assets"?assets:k==="user"?{can:async()=>true}:null}};

/* ---------- 계정 동기화 (Supabase) ---------- */
function mergeIn(remote){
  let n=0;
  for(const [id,d] of Object.entries(remote||{})){
    const cur=store.wishes[id];
    if(!cur||(d._t||0)>(cur._t||0)){store.wishes[id]=d;n++}
  }
  return n;
}
async function pull(){
  if(!sb||!session)return;
  setSync("동기화 중…");
  const {data,error}=await sb.from("dogam").select("data").eq("user_id",session.user.id).maybeSingle();
  if(error){setSync("동기화 실패: "+error.message);return}
  mergeIn(data&&data.data&&data.data.wishes);
  persist();emit();
  await push();
}
async function push(){
  if(!sb||!session)return;
  const {error}=await sb.from("dogam").upsert({user_id:session.user.id,data:{wishes:store.wishes},updated_at:new Date().toISOString()});
  setSync(error?"저장 실패: "+error.message:"계정에 저장됨 · "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}));
}
function schedulePush(){if(!session)return;clearTimeout(pushT);setSync("저장 대기 중…");pushT=setTimeout(push,1200)}
function setSync(t){syncState=t;const el=document.getElementById("uSync");if(el)el.textContent=t}

async function initSB(){
  if(!hasSB)return;
  if(!window.supabase){await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)}).catch(()=>{})}
  if(!window.supabase)return;
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);
  try{const q=new URLSearchParams(location.search+"&"+location.hash.slice(1));const er=q.get("error_description");if(er){setTimeout(()=>toastSafe("로그인 실패: "+er),800);history.replaceState(null,"",location.pathname)}}catch(_){}
  const {data}=await sb.auth.getSession();session=data.session;
  sb.auth.onAuthStateChange((_e,s)=>{const was=session&&session.user.id;session=s;userUi();if(s&&s.user.id!==was){ready.then(pull)}});
  userUi();
  if(session)ready.then(pull);
  else{let later=null;try{later=sessionStorage.getItem("dogam-later")}catch(_){}if(!later)openUser()}
}

/* ---------- 로그인 화면 ---------- */
const $u=id=>document.getElementById(id);
function userUi(){
  const b=$u("userBtn");if(b)b.classList.toggle("on",!!session);
  const B=$u("uBody");if(!B||$u("uOverlay").hidden)return;
  const backup=`<details class="ubk"><summary>백업 파일로 저장하기</summary><div class="ubtns"><button type="button" class="ubtn ghost" id="uExport">백업 내려받기</button><label class="ubtn ghost">백업 불러오기<input type="file" id="uImport" accept="application/json" hidden></label></div></details>`;
  if(!hasSB){
    B.innerHTML=`<div class="uhead"><div class="uav">${ic("user")}</div><h3>이 브라우저에 저장 중</h3><p>지금은 기록이 이 브라우저에만 저장돼요.<br>로그인 기능은 <b>설명서.txt 3단계</b>(Supabase 연결)를 하면 켜져요.</p></div>`+backup;
  }else if(!session){
    B.innerHTML=`<div class="uhead"><div class="uav big">${AV&&AV["치이카와"]?`<img src="${AV["치이카와"]}" alt="">`:ic("user")}</div><h3>치이카와 위시 도감</h3><p>로그인하면 폰·PC 어디서든<br>내 위시·토벌 기록을 같이 볼 수 있어요.</p></div>

  $("sideFoot").innerHTML=`<div><span>위시</span><b>${fmt(sum(w))}원</b></div><div><span>토벌</span><b>${fmt(sum(b))}원</b></div><div><span>아낀 돈</span><b style="color:var(--green)">${fmt(sum(p))}원</b></div>`;

}
function renderFilters(){
  const BASE={};const cnt=(key,fn)=>{const base=BASE[key]||(BASE[key]=state.items.filter(i=>match(i,key)));const memo=new Map();return v=>{if(v==="all")return base.length;if(!memo.has(v))memo.set(v,base.reduce((n,i)=>n+(fn(i,v)?1:0),0));return memo.get(v)}};
  const cc=cnt("cat",(i,v)=>catOf(i)===v);
  const cats=["all"].concat(CATS).filter(v=>v==="all"||cc(v)||state.cat===v);
  $("catPills").innerHTML=cats.map(v=>`<button type="button" class="pill" data-v="${esc(v)}" aria-pressed="${state.cat===v}">${v==="all"?"전체":esc(v)}<span class="n">${cc(v)}</span></button>`).join("");
  $("sideCats").innerHTML=cats.map(v=>`<button type="button" class="sitem" data-v="${esc(v)}" aria-current="${state.cat===v}">${v==="all"?ic("grid"):`<span class="bullet">·</span>`}${v==="all"?"전체":esc(v)}<span class="n">${cc(v)}</span></button>`).join("");
  const co=cnt("color",(i,v)=>(i.colors||[]).includes(v));
  $("colorChips").innerHTML=[["all",""]].concat(COLORS).map(([n,h])=>`<button type="button" class="chip" data-v="${n}" aria-pressed="${state.color===n}">${h?`<span class="sw" style="background:${h}"></span>`:""}${n==="all"?"전체":n} <span style="opacity:.55;font-size:12px">${co(n)}</span></button>`).join("");
  const ch=cnt("char",(i,v)=>hasChar(i,v));
  const prog=n=>{const a=n==="all"?state.items:state.items.filter(i=>i.character===n);const b=a.filter(i=>i.status==="bought").length;return [b,a.length]};
  const pct=(b,t)=>t?(b/t*100<1&&b?(b/t*100).toFixed(1):Math.round(b/t*100)):0;
  $("charSeg").innerHTML=["all"].concat(CHARS).filter(n=>n==="all"||ch(n)||state.char===n).map(n=>{const [b,t]=prog(n);return `<button type="button" class="fr" data-v="${n}" aria-pressed="${state.char===n}" title="${n==="all"?"전체":n} ${t}종 중 ${b}종 토벌">${ring(n,t?b/t*100:0,48)}<span class="nm">${n==="all"?"모두":n}</span><span class="pc">${pct(b,t)}%</span></button>`}).join("");
  const SECN={cat:"종류",series:"시리즈",color:"색",shop:"판매처"};
  const act=Object.keys(SECN).filter(k=>state[k]!=="all");
  $("fbar").innerHTML=Object.keys(SECN).map(k=>state[k]!=="all"?`<button type="button" class="fchip on" data-sec="${k}">${esc(state[k])}<span class="x" data-clr="${k}" aria-label="${SECN[k]} 해제">✕</span></button>`:`<button type="button" class="fchip" data-sec="${k}">${SECN[k]}<svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>`).join("")+(act.length>1?`<button type="button" class="fchip rs" data-clr="all">모두 해제</button>`:"");

  const se=cnt("series",(i,v)=>seriesOf(i)===v);

  const sers=Object.keys(sc2).concat(state.series!=="all"&&!sc2[state.series]?[state.series]:[]).sort((x,y)=>(sc2[y]||[0])[0]-(sc2[x]||[0])[0]);
  $("serSeg").innerHTML=[`<button type="button" class="pill" data-v="all" aria-pressed="${state.series==="all"}">모든 시리즈</button>`].concat(sers.map(x=>{const [t,b]=sc2[x]||[0,0];return `<button type="button" class="pill" data-v="${esc(x)}" aria-pressed="${state.series===x}" title="${t}종 중 ${b}종 토벌">${esc(x)}<span class="n">${se(x)}</span>${b?`<span class="pc">${Math.round(b/t*100)||"<1"}%</span>`:""}</button>`})).join("");

  return a+m+c};
function card(i,k){

}

const ring=(n,p,sz)=>`<span class="av" style="--cc:${CH_COLOR[n]||"#d9708f"};--p:${p};--sz:${sz}px">${AV[n]?`<img class="face" src="${AV[n]}" alt="">`:`<i>${n==="all"?"전":n==="모두 함께"?"♥":esc(n.slice(0,1))}</i>`}</span>`;
function charProg(n){const a=n==="all"?state.items:state.items.filter(i=>i.character===n);const b=a.filter(i=>i.status==="bought").length;const w=a.filter(i=>i.status==="wish").length;return {a,b,w,t:a.length,p:a.length?b/a.length*100:0}}
function pgCard(){const n=state.char;const g=charProg(n);const pc=g.p<1&&g.b?g.p.toFixed(1):Math.round(g.p);
  return `<div class="pg" style="--cc:${CH_COLOR[n]||"#d9708f"}">${ring(n,g.p,52)}<div class="pgt"><b>${n==="all"?"치이카와 친구들":esc(n)} 도감</b><span><b>${g.b}</b> / ${g.t}개 토벌 · ${pc}%</span><div class="meter big"><i style="width:${Math.max(g.p,g.b?1.5:0)}%"></i></div><span class="pgs">위시 ${g.w} · 남은 ${g.t-g.b}</span></div></div>`}
function dexCell(i){
  const n=dexNo.get(i.id)||0;
  const ico=i.status==="bought"?`<span class="ico">${ic("spear","i")}</span>`:i.status==="wish"?`<span class="ico w">${ic("heart","i")}</span>`:i.status==="pass"?`<span class="ico" style="color:#248a3d">${ic("shield","i")}</span>`:"";
  return `<div class="dx ${i.status==="bought"?"own":""} ${i.status==="wish"?"wished":""}" data-id="${esc(i.id)}" tabindex="0" role="button" aria-label="${esc(i.name)}"><div class="art">${imgHtml(i)}</div>${ico}<span class="no">No.${String(n).padStart(3,"0")}</span></div>`;
}
function listRow(i){
  const n=dexNo.get(i.id)||0;
  const rk=state.sort==="pop"&&rankOf(i)<2?`<span class="lrk">${n}위</span>`:"";
  const stl={wish:"위시",bought:"토벌 완료",pass:"참음"}[i.status];
  let q="";
  if(!readOnly){
    if(i.status==="cand")q=`<button type="button" class="qb spear" data-act="bought" aria-label="토벌">${ic("spear","i")}</button><button type="button" class="qb hb" data-act="heart" aria-pressed="false" aria-label="위시에 담기">${ic("heart","i")}</button>`;
    else if(i.status==="wish")q=`<button type="button" class="qb cartq" data-act="cart" aria-pressed="${!!i.cart}" aria-label="장바구니">${ic("cart","i")}</button><button type="button" class="qb spear" data-act="bought" aria-label="토벌">${ic("spear","i")}</button>${state.status==="wish"?`<button type="button" class="qb shield" data-act="pass" aria-label="참음">${ic("shield","i")}</button>`:""}<button type="button" class="qb hb" data-act="heart" aria-pressed="true" aria-label="위시에서 빼기">${ic("heart","i")}</button>`;
    else q=`<button type="button" class="qb" data-act="undo" aria-label="${i.status==="bought"?"토벌 취소":"참음 취소"}">${ic("undo","i")}</button>`;
  }
  const meta=[i.released,i.shop].filter(Boolean).join(" · ")+soldTag(i);
  return `<div class="lrow" data-id="${esc(i.id)}" tabindex="0" role="button" aria-label="${esc(i.name)}"><div class="lth"><div class="art">${imgHtml(i)}</div></div>
    <div class="lt">${stl?`<span class="lst ${i.status}">${stl}</span>`:""}<span class="cn">${rk}${esc(i.name)}</span><span class="cp">${priceHtml(i)}</span>${mktHtml(i)}<span class="cm">${meta}</span></div><div class="qbs">${q}</div></div>`;
}

/* 카드가 화면에 들어올 때 살짝 떠오르며 등장 (이미 본 카드는 다시 안 움직임) */
const SEEN=new Set();let revIO=null,revSafe=null;
function revShow(el,k){el.style.transitionDelay=Math.min(k,8)*45+"ms";requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("in")));SEEN.add(el.dataset.id);
  setTimeout(()=>{el.classList.remove("rv","in");el.style.transitionDelay=""},1000)}
function reveal(){
  if(!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  if(!revIO)revIO=new IntersectionObserver(es=>{let k=0;es.forEach(e=>{if(!e.isIntersecting)return;revIO.unobserve(e.target);revShow(e.target,k++)})},{rootMargin:"0px 0px -20px 0px"});
  let k=0;const H=innerHeight;
  document.querySelectorAll("#list [data-id]").forEach(el=>{if(SEEN.has(el.dataset.id)||el.classList.contains("rv"))return;
    const r=el.getBoundingClientRect();el.classList.add("rv");
    if(r.top<H*1.15&&r.bottom>0)revShow(el,k++);else revIO.observe(el)});
  clearTimeout(revSafe);revSafe=setTimeout(()=>{document.querySelectorAll("#list .rv:not(.in)").forEach((el,i)=>{const r=el.getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0){revIO.unobserve(el);revShow(el,i)}})},350);
}
addEventListener("scroll",()=>{clearTimeout(revSafe);revSafe=setTimeout(()=>{document.querySelectorAll("#list .rv:not(.in)").forEach((el,i)=>{const r=el.getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0){revIO&&revIO.unobserve(el);revShow(el,i)}})},300)},{passive:true,capture:true});
function render(){const m=document.querySelector(".main"),a=m?m.scrollTop:0,b=window.scrollY;_render();renderCart();reveal();if(m)m.scrollTop=a;window.scrollTo(0,b)}
function _render(){
  renderTop();renderFilters();
  const L=$("list");
  if(!state.loaded){L.innerHTML=`<div class="empty"><h3>${state.error?esc(state.error):"불러오는 중…"}</h3></div>`;return}
  const v=visible();
  if(!v.length){
    const filtered=state.q||state.cat!=="all"||state.color!=="all"||state.char!=="all"||state.series!=="all"||state.shop!=="all";
    const t=TABS.find(x=>x[0]===state.status);
    const msg=filtered?["검색 결과 없음","검색어나 필터를 바꿔 보세요."]
      :state.status==="wish"?["아직 위시가 없어요","전체에서 진짜 갖고 싶은 것만 하트를 눌러 담아요."]
      :state.status==="pass"?["아직 참은 굿즈가 없어요","위시에서 참음을 누르면 아낀 돈이 쌓여요."]
      :state.status==="bought"?["아직 토벌한 굿즈가 없어요","손에 넣은 굿즈는 토벌로 옮겨요."]
      :state.status==="all"?["아직 굿즈가 없어요","+ 버튼으로 굿즈를 추가해요."]
      :["후보가 비어 있어요","+ 버튼으로 굿즈를 추가해요."];
    L.innerHTML=`<div class="empty"><div class="ei">${ic(t[2])}</div><h3>${msg[0]}</h3><p>${msg[1]}</p>${!filtered&&state.status==="wish"?`<button type="button" class="plain-btn" id="goCand">전체 보기</button>`:""}</div>`;
    const g=$("goCand");if(g)g.onclick=()=>setStatus("all");
    return}
  const own=a=>a.filter(i=>i.status==="bought").length;
  const box=a=>state.view==="dex"?`<div class="dexgrid">${a.map(dexCell).join("")}</div>`:state.view==="list"?`<div class="listv">${a.map(listRow).join("")}</div>`:`<div class="grid">${a.map((x,k)=>card(x,k)).join("")}</div>`;
  const head=pgCard();
  dexNo=new Map(v.map((x,k)=>[x.id,k+1]));
  const shown=v.slice(0,state.limit);
  L.innerHTML=head+box(shown)+(v.length>shown.length?`<button type="button" class="plain-btn loadmore" style="align-self:center">${Math.min(120,v.length-shown.length)}개 더 보기 (남은 ${v.length-shown.length}개)</button>`:"");
}

  const c=e.target.closest("[data-id]");if(!c)return;
  const it=state.items.find(x=>x.id===c.dataset.id);if(!it)return;
  const b=e.target.closest("button[data-act]");
  if(!b)return openForm(it);
  if(!db)return;
  const act=b.dataset.act;
  b.disabled=true;
  try{
    if(act==="heart"){const on=it.status!=="wish";const prev=it.status;KEEP.add(it.id);
      const ch=on?{status:"wish",wishedAt:Date.now(),decidedAt:null}:{status:"cand",decidedAt:null};
      Object.assign(it,ch);render();
      try{await writeItem({...it,status:prev},ch)}catch(err){it.status=prev;render();throw err}
      return}
    if(act==="cart"){const on=!it.cart;const prev=it.status;KEEP.add(it.id);
      const ch=on?{cart:true,cartAt:Date.now()}:{cart:false};
      Object.assign(it,ch);render();toast(on?"장바구니에 담았어요":"장바구니에서 뺐어요","cart");
      try{await writeItem({...it,status:prev},ch)}catch(err){it.cart=!on;render();throw err}
      return}
    if(act==="own"){const on=it.status!=="bought";const prev=it.status;KEEP.add(it.id);
      const ch=on?{status:"bought",decidedAt:Date.now(),from:prev,cart:false}:{status:it.from==="wish"?"wish":"cand",decidedAt:null};
      Object.assign(it,ch);render();if(on)toast("토벌 완료!","spear");
      try{await writeItem({...it,status:prev},ch)}catch(err){it.status=prev;render();throw err}
      return}
    if(act==="promote"){await writeItem(it,{status:"wish",wishedAt:Date.now(),decidedAt:null});toast("위시에 담았어요","heart")}
    else if(act==="unwish"){await writeItem(it,{status:"cand",decidedAt:null});toast("위시에서 뺐어요","undo")}
    else if(act==="undo"){const back=it.from==="wish"?"wish":"cand";await writeItem(it,{status:back,decidedAt:null});toast((it.status==="bought"?"토벌":"참음")+" 취소 · "+(back==="wish"?"위시로 돌아갔어요":"원래대로 돌아갔어요"),"undo")}
    else{await writeItem(it,{status:act,decidedAt:Date.now(),from:it.status,cart:false});act==="pass"?toast(`${fmt(krw(it))}원 지켰어요`,"shield"):toast("토벌 완료","spear")}
  }catch(err){toast("저장하지 못했어요. 다시 눌러 주세요.");b.disabled=false}
});
/* 장바구니 */
const inCart=()=>state.items.filter(i=>i.cart&&i.status!=="bought"&&i.status!=="pass").sort((a,b)=>(a.cartAt||0)-(b.cartAt||0));
function renderCart(){
  const c=inCart();const n=c.length;
  $("cartBtn").innerHTML=ic("cart")+(n?`<span class="dot">${n}</span>`:"");
  if($("cOverlay").hidden)return;
  const B=$("cBody");
  if(!n){B.innerHTML=`<div class="cempty"><div class="ei">${ic("cart")}</div><h3>장바구니가 비어 있어요</h3><p>카드 아래 카트 버튼을 누르면 담겨요.<br>사기 전에 여기서 한 번 더 생각해 봐요.</p></div>`;return}
  const tot=c.reduce((s,i)=>s+effKrw(i),0);
  const shops={};c.forEach(i=>{(shops[i.shop||"직접 추가"]=shops[i.shop||"직접 추가"]||[]).push(i)});
  const days=i=>Math.max(0,Math.floor((Date.now()-(i.cartAt||Date.now()))/86400000));
  B.innerHTML=Object.entries(shops).map(([sh,arr])=>`<div class="cshop"><div class="csh"><b>${esc(sh)}</b><span>${arr.length}개 · ${fmt(arr.reduce((s,i)=>s+effKrw(i),0))}원</span></div>
    ${arr.map(i=>`<div class="crow" data-cid="${esc(i.id)}"><div class="cth"><div class="art">${imgHtml(i)}</div></div><div class="ct"><span class="cn">${esc(i.name)}</span><span class="cp">${priceHtml(i)}</span><span class="cm">담은 지 ${days(i)}일${i.available===false?` · <span class="so">${i.upcoming?"판매 예정":"품절"}</span>`:""}</span></div>
      <div class="cacts"><button type="button" class="cbt own" data-cact="bought" title="샀어요 (토벌)">${ic("spear","i sm")}</button><button type="button" class="cbt pass" data-cact="pass" title="참을래요">${ic("shield","i sm")}</button><button type="button" class="cbt rm" data-cact="rm" title="빼기" aria-label="장바구니에서 빼기">✕</button></div></div>`).join("")}</div>`).join("")+
  `<div class="csum"><div class="cline"><span>상품 ${n}개</span><b>${fmt(tot)}원</b></div>
   <p class="chint">${ic("shield","i sm")} 전부 참으면 <b>${fmt(tot)}원</b>을 아낄 수 있어요</p>
   ${readOnly?"":`<div class="cbtns"><button type="button" class="cbig pass" data-call="pass">전부 참기</button><button type="button" class="cbig own" data-call="bought">전부 토벌 완료</button></div>`}</div>`;
}
$("cartBtn").onclick=()=>{$("cOverlay").hidden=false;renderCart()};
$("cClose").onclick=()=>{$("cOverlay").hidden=true};
$("cOverlay").addEventListener("click",async e=>{
  if(e.target.id==="cOverlay"){$("cOverlay").hidden=true;return}
  if(readOnly||!db)return;
  const all=e.target.closest("[data-call]");
  if(all){const st=all.dataset.call;const c=inCart();const tot=c.reduce((s,i)=>s+effKrw(i),0);all.disabled=true;
    try{for(const it of c){const ch={status:st,decidedAt:Date.now(),from:it.status,cart:false};await writeItem(it,ch);Object.assign(it,ch)}
      toast(st==="pass"?`${fmt(tot)}원 지켰어요!`:"전부 토벌 완료!",st==="pass"?"shield":"spear")}catch(err){toast("저장하지 못했어요. 다시 눌러 주세요.")}
    render();return}
  const b=e.target.closest("[data-cact]");if(!b)return;
  const it=state.items.find(x=>x.id===b.closest("[data-cid]").dataset.cid);if(!it)return;
  const a=b.dataset.cact;b.disabled=true;
  const ch=a==="rm"?{cart:false}:{status:a,decidedAt:Date.now(),from:it.status,cart:false};
  try{await writeItem(it,ch);Object.assign(it,ch);toast(a==="rm"?"장바구니에서 뺐어요":a==="pass"?`${fmt(effKrw(it))}원 지켰어요`:"토벌 완료!",a==="rm"?"cart":a==="pass"?"shield":"spear")}catch(err){toast("저장하지 못했어요. 다시 눌러 주세요.");b.disabled=false}
  render();
});
$("list").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.id){e.preventDefault();e.target.click()}});

/* 시트 */
$("fCat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
$("fChar").innerHTML=CHARS.map(c=>`<option>${c}</option>`).join("");
function syncForm(){
  const canPass=editing&&(editing.status==="wish"||editing.status==="pass");
  $("fStatus").innerHTML=[["cand","없음"]].concat(TABS.filter(t=>t[0]!=="all"&&(t[0]!=="pass"||canPass))).map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${formStatus===k}">${l}</button>`).join("");
  $("fColors").innerHTML=COLORS.map(([n,h])=>`<button type="button" class="chip" data-v="${n}" aria-pressed="${formColors.includes(n)}"><span class="sw" style="background:${h}"></span>${n}</button>`).join("");
}
$("fLineup").addEventListener("click",e=>{const b=e.target.closest("[data-lid]");if(!b)return;const x=state.items.find(i=>i.id===b.dataset.lid);if(x){openForm(x);document.querySelector("#overlay .sheet").scrollTo({top:0})}});
$("fStatus").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;formStatus=b.dataset.v;syncForm()});
$("fColors").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const v=b.dataset.v;formColors=formColors.includes(v)?formColors.filter(x=>x!==v):formColors.concat(v);syncForm()});
function setHero(src){$("fHero").innerHTML=src?`<img src="${esc(src)}" alt="">`:`<span class="mono">사진 없음</span>`;$("fPhotoClear").hidden=!src||!assets}
function openForm(it){
  editing=it||null;pendingPhoto=null;clearPhoto=false;
  $("formTitle").textContent=it?"굿즈 정보":"새 굿즈";
  $("fSave").textContent=it?"완료":"추가";$("fSave").hidden=readOnly;
  $("fName").value=it?.name||"";
  $("fPrice").value=it?.price??"";
  $("fCur").value=it?.currency||"KRW";
  $("fCat").value=it?catOf(it):(state.cat!=="all"?state.cat:"마스코트");
  $("fChar").value=it?.character||"치이카와";
  $("fLink").value=it?.link||"";
  $("fMemo").value=it?.memo||"";
  $("fPhoto").value="";
  formColors=(it?.colors||[]).slice();formStatus=it?it.status:"wish";
  $("statusGroup").hidden=!it;
  syncForm();
  $("fHero").innerHTML=(it&&imgHtml(it))||`<span class="mono">사진 없음</span>`;$("fPhotoClear").hidden=!(it&&imgOf(it))||!assets;
  const lh=it?.link&&safeUrl(it.link);
  $("fLinks").innerHTML=(it?.nameJa?`<p class="ja">${esc(it.nameJa)}</p>`:"")+(lh?`<a href="${esc(lh)}" target="_blank" rel="noopener">판매 페이지 열기</a>`:"");
  const jq=it?.nameJa?mercariQ(it.nameJa):"";
  const mm=it&&mkt(it);
  $("fMkt").innerHTML=(mm?`<div class="mbox"><b>메루카리 시세 ¥${fmt(mm.p)}</b><span>약 ${fmt(mm.p*RATES.JPY)}원 · 보통 ¥${fmt(mm.lo)}~¥${fmt(mm.hi)}</span><small>최근 판매완료 ${mm.n}건 기준 · ${esc(mm.at)}</small></div>`:"")+(it?((jq?`<a class="mb" href="https://jp.mercari.com/search?keyword=${encodeURIComponent(jq)}" target="_blank" rel="noopener">메루카리에서 찾기${ic("go","i sm")}</a>`:"")+`<a class="mb" href="https://m.bunjang.co.kr/search/products?q=${encodeURIComponent(bunjangQ(it))}" target="_blank" rel="noopener">번개장터에서 찾기${ic("go","i sm")}</a>`):"");
  renderLineup(it);
  $("fLinks").style.flexDirection="column";$("fLinks").style.alignItems="center";$("fLinks").style.gap="14px";
  $("photoGroup").hidden=!assets||readOnly;
  $("delGroup").hidden=!it||readOnly;$("fDelete").classList.remove("armed");$("fDelete").textContent="삭제";
  $("fErr").hidden=true;
  $("overlay").hidden=false;
}
window.openForm=openForm;
function closeForm(){$("overlay").hidden=true;editing=null;pendingPhoto=null}
$("fCancel").onclick=closeForm;
$("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeForm()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("cOverlay").hidden=true;if(!$("overlay").hidden)closeForm();$("fOverlay").hidden=true}});
$("addBtn").onclick=()=>{if(!readOnly)openForm()};
$("fPhoto").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;
  if(f.size>20*1024*1024){$("fErr").textContent="사진이 20MB보다 커요. 더 작은 사진을 골라 주세요.";$("fErr").hidden=false;e.target.value="";return}
  pendingPhoto=f;clearPhoto=false;setHero(URL.createObjectURL(f))});
$("fPhotoClear").onclick=()=>{pendingPhoto=null;clearPhoto=true;$("fPhoto").value="";setHero("")};
$("fDelete").onclick=async()=>{
  const b=$("fDelete");
  if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="한 번 더 누르면 삭제돼요";return}
  if(!editing||!db)return;
  try{if(catIds.has(editing.id))await writeItem(editing,{status:"hidden"});else await db.collection("wishes").doc(editing.id).delete();toast("삭제했어요");closeForm()}catch(e){$("fErr").textContent="삭제하지 못했어요. 다시 시도해 주세요.";$("fErr").hidden=false}
};
$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  if(readOnly)return closeForm();
  const name=$("fName").value.trim();
  if(!name){$("fErr").textContent="굿즈 이름을 적어 주세요.";$("fErr").hidden=false;return}
  if(!db){$("fErr").textContent="저장소에 연결되지 않았어요. 로그인한 상태에서 다시 열어 주세요.";$("fErr").hidden=false;return}
  const save=$("fSave");save.disabled=true;
  try{
    let photo=editing?.photo||null;
    if(clearPhoto){photo=null;if(editing)editing._clearImg=true}
    if(pendingPhoto&&assets){const r=await assets.upload(pendingPhoto);photo=r.id}
    const data={...(editing&&editing._clearImg?{img:null}:{}),name,character:$("fChar").value,category:$("fCat").value,colors:formColors,
      price:Math.max(0,+$("fPrice").value||0),currency:$("fCur").value,link:$("fLink").value.trim(),memo:$("fMemo").value.trim(),photo};
    if(editing){
      if(formStatus!==editing.status){data.status=formStatus;data.decidedAt=(formStatus==="bought"||formStatus==="pass")?Date.now():null;if(formStatus==="wish"&&editing.status==="cand")data.createdAt=Date.now()}
      await writeItem(editing,data);toast("저장했어요");
    }else{await db.collection("wishes").add({...data,status:"wish",createdAt:Date.now(),decidedAt:null});toast("위시에 담았어요","heart")}
    closeForm();
  }catch(err){
    const c=err&&err.code;
    $("fErr").textContent=c==="too_large"?"사진이 너무 커요. 더 작은 사진으로 바꿔 주세요.":c==="unsupported_type"?"PNG, JPG, WEBP, GIF 사진만 올릴 수 있어요.":c==="quota_exceeded"||c==="quota_or_state"?"저장 공간이 가득 찼어요. 안 쓰는 굿즈를 지워 주세요.":"저장하지 못했어요. 잠시 후 다시 시도해 주세요.";
    $("fErr").hidden=false;
  }finally{save.disabled=false}
});

/* 연결 */
let RATE_DATE="";
function rateText(){$("rateNote").textContent=`1엔 = ${RATES.JPY}원 · 1위안 = ${RATES.CNY}원`+(RATE_DATE?` · ${RATE_DATE} 환율`:"")+(window.__DOGAM_UPDATED?` · 굿즈 목록 ${window.__DOGAM_UPDATED} 업데이트`:"")}
rateText();render();
{const DD=window.DOGAM_DATA||{};if(DD.market)MKT=DD.market;if(DD.catalog){CAT=DD.catalog;catIds=new Set(CAT.items.map(i=>i.id));merge()}
  if(DD.updated)setTimeout(()=>{const n=$("rateNote");if(n&&!n.dataset.u){n.dataset.u=1}},0);window.__DOGAM_UPDATED=DD.updated||""}
(async()=>{
  const cl=window.claude;
  if(!cl||!cl.use){state.error="저장소에 연결할 수 없어요";readOnly=true;render();return}
  const [d,a,u]=await Promise.all([cl.use("db"),cl.use("assets").catch(()=>null),cl.use("user").catch(()=>null)]);
  db=d;assets=a;
  if(!db){readOnly=true;state.error="로그인하면 도감을 볼 수 있어요";render();return}
  try{const w=u&&await u.can("data.write");if(w===false){readOnly=true;$("addBtn").hidden=true}}catch(e){}
  const timer=setTimeout(()=>{if(!state.loaded){state.error="아직 불러오지 못했어요. 연결을 확인해 주세요.";render()}},10000);
  db.collection("wishes").onSnapshot(snap=>{
    dbItems=snap.docs.map(d=>({id:d.id,...d.data()}));merge();
    if(!snap.metadata.fromCache){clearTimeout(timer);state.error=""}
    state.loaded=true;render();
  },()=>{clearTimeout(timer);state.error="불러오지 못했어요.";render()});
  db.doc("meta/settings").onSnapshot(s=>{const v=s.exists?s.data():{};if(v.jpyRate>0)RATES.JPY=v.jpyRate;if(v.cnyRate>0)RATES.CNY=v.cnyRate;if(v.rateDate)RATE_DATE=v.rateDate;rateText();render()},()=>{});
})();

/* 배경음악: config.js 의 bgm 에 유튜브 영상 ID 를 넣으면 바꿀 수 있어요 */
(function(){
  const id=((window.DOGAM_CONFIG||{}).bgm)||"qKrtED0Xyx0";
  const btn=document.getElementById("bgmBtn"),panel=document.getElementById("bgmPanel"),fr=document.getElementById("bgmFrame");
  function on(){fr.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&loop=1&playlist=${encodeURIComponent(id)}&playsinline=1&rel=0" title="배경음악" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;panel.hidden=false;btn.classList.add("on")}
  function off(){fr.innerHTML="";panel.hidden=true;btn.classList.remove("on")}
  btn.onclick=()=>panel.hidden?on():off();
  document.getElementById("bgmClose").onclick=off;
})();
</script>
