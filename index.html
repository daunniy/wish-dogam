<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="치이카와 도감">
<title>치이카와 위시 도감</title>
<script src="config.js"></script>
<script src="data/bundle.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
html,body{margin:0}
/* Layout: 폰 = iOS 앱(큰 제목, 검색바, 종류 칩, 2열 카드, 하단 블러 탭바) / PC = 굿즈샵 웹사이트(상단 헤더 탭 + 넓은 본문 + 큰 카드) */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --tint:#ff2d55; --tint-soft:rgba(255,45,85,.1); --on-tint:#ffffff;
  --green:#34c759; --green-soft:rgba(52,199,89,.12);
  --bar:rgba(249,249,249,.86); --photo:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  --side:rgba(236,236,240,.78); --win:#ffffff; --desk:#dcdde3; --win-edge:rgba(0,0,0,.14);
  --page:#fff6f8; --line:rgba(255,45,85,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --tint:#ff375f; --tint-soft:rgba(255,55,95,.18); --on-tint:#ffffff;
  --green:#30d158; --green-soft:rgba(48,209,88,.16);
  --bar:rgba(22,22,24,.86); --photo:#ffffff; --shadow:none;
  --side:rgba(44,44,48,.82); --win:#1e1e20; --desk:#111114; --win-edge:rgba(255,255,255,.12); --page:#111113; --line:rgba(255,255,255,.1); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --tint:#ff375f; --tint-soft:rgba(255,55,95,.18); --on-tint:#ffffff;
  --green:#30d158; --green-soft:rgba(48,209,88,.16);
  --bar:rgba(22,22,24,.86); --photo:#ffffff; --shadow:none;
  --side:rgba(44,44,48,.82); --win:#1e1e20; --desk:#111114; --win-edge:rgba(255,255,255,.12); --page:#111113; --line:rgba(255,255,255,.1); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:15px;line-height:1.4;letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:17px;height:17px}

.app{max-width:900px;margin:0 auto}
.side{display:none}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}

/* 툴바 (폰: 버튼줄 → 큰 제목 → 검색) */
.toolbar{display:grid;grid-template-columns:1fr auto;grid-template-areas:"x btns" "title title" "search search";gap:6px 4px;align-items:center}
.tb-btns{grid-area:btns;display:flex;gap:4px}
.tb-title{grid-area:title}
.tb-search{grid-area:search;margin-top:6px}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--tint);position:relative}
.iconbtn:active{background:var(--fill)}
.iconbtn .dot{position:absolute;top:5px;right:5px;min-width:15px;height:15px;border-radius:8px;background:var(--tint);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.subtitle{color:var(--label2);font-size:15px;margin:2px 0 0;font-variant-numeric:tabular-nums}
.subtitle b{color:var(--label);font-weight:700}

/* 요약 위젯 */
.widget{background:var(--card);border-radius:16px;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;box-shadow:var(--shadow)}
.widget > button{display:flex;flex-direction:column;gap:1px;min-width:0;text-align:left}
.widget .k{font-size:12px;color:var(--label2);font-weight:600;display:flex;align-items:center;gap:4px}
.widget .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.widget .wish .v{color:var(--tint)}
.widget .saved .v{color:var(--green)}
.widget .s{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget > button + button{border-left:.5px solid var(--sep);padding-left:12px}
@media (max-width:400px){.widget{padding:14px 12px;gap:8px}.widget .v{font-size:17px}.widget > button + button{padding-left:8px}}

/* 검색 */
.searchbar{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;color:var(--label2)}
.searchbar input{border:0;background:transparent;flex:1;min-width:0;outline:none;color:var(--label);font-size:16px}
.searchbar input::placeholder{color:var(--label2)}
.scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroll::-webkit-scrollbar{display:none}
.pill{flex:none;height:32px;padding:0 14px;border-radius:16px;background:var(--card);font-size:14px;font-weight:500;color:var(--label);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:5px}
.pill[aria-pressed="true"]{background:var(--label);color:var(--bg)}
.pill .n{font-size:12px;opacity:.5}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{height:28px;border-radius:7px;font-size:13px;font-weight:600;color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}

/* 그룹·카드 */
#list{display:flex;flex-direction:column;gap:22px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 8px;gap:8px}
.ghead h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em}
.ghead span{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.card.dim{opacity:.62}
.ph{aspect-ratio:1/1;max-width:100%;background:var(--photo);position:relative;display:grid;place-items:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5%}
.ph .mono{font-size:28px;font-weight:700;color:#c7c7cc}
.cat{position:absolute;top:8px;left:8px;height:22px;padding:0 8px;border-radius:11px;background:rgba(0,0,0,.05);color:#3a3a3c;font-size:11px;font-weight:600;display:flex;align-items:center}
.st{position:absolute;top:8px;right:8px;height:24px;padding:0 8px;border-radius:12px;display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;background:rgba(255,255,255,.94);color:#1c1c1e;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.st.pass{color:#248a3d}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.cn{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cp{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cp small{font-size:12px;font-weight:500;color:var(--label2);margin-left:4px}
.cm{font-size:12px;color:var(--label2)}
.ca{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.ab.icon{flex:0 0 34px}
.ab.go{min-width:0;white-space:nowrap}
.ab{flex:1;height:34px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;color:var(--label);min-width:0}
.ab.heart{background:var(--tint-soft);color:var(--tint)}
.ab.spear{background:var(--label);color:var(--bg)}
.ab.shield{background:var(--green-soft);color:var(--green)}
.hb{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:none;color:#8e8e93;z-index:1}
.hb svg.i{width:24px;height:24px;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.hb.pb{top:50px;width:34px;height:34px;right:8px;color:#248a3d;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.12)}.hb.pb svg.i{width:19px;height:19px;filter:none}.hb.pb[aria-pressed="true"]{background:#34c759;color:#fff}.hb.pb[aria-pressed="true"] svg.i{fill:none}
.ob{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.95);color:#aeaeb2;box-shadow:inset 0 0 0 1.5px #d1d1d6,0 1px 4px rgba(0,0,0,.1);z-index:1}
.ob svg.i{width:20px;height:20px}
.ob[aria-pressed="true"]{background:#e5484d;color:#fff;box-shadow:0 2px 6px rgba(229,72,77,.4)}
.card.own{box-shadow:0 0 0 2px #f0a1a6,var(--shadow)}
.ab.go.mk{color:var(--label)}
@media (prefers-reduced-motion:no-preference){.ob[aria-pressed="true"] svg.i{animation:pop .3s ease}}
.hb[aria-pressed="true"]{color:#ff2d55}.hb[aria-pressed="true"] svg.i{fill:currentColor}
.qb.hb{position:static;box-shadow:none;background:var(--fill);color:var(--label2)}.qb.hb[aria-pressed="true"]{background:var(--tint-soft);color:var(--tint)}
@media (prefers-reduced-motion:no-preference){.hb[aria-pressed="true"] svg.i{animation:pop .3s ease}@keyframes pop{50%{transform:scale(1.3)}}}
.more{font-size:13px;color:var(--tint);font-weight:600;white-space:nowrap}
.ab.undo{background:transparent;box-shadow:inset 0 0 0 1px var(--sep);color:var(--label2);font-weight:500}
.ab.go{background:transparent;box-shadow:inset 0 0 0 1px var(--sep);color:var(--tint);text-decoration:none}
.ca + .ca{padding-top:6px}
.st.wish{color:#ff2d55}
.rk{position:absolute;bottom:8px;left:8px;height:22px;min-width:22px;padding:0 7px;border-radius:11px;background:#1c1c1e;color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rk.top{background:#ff2d55}
.main > *{flex-shrink:0}
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sortwrap{display:inline-flex;align-items:center;gap:4px;color:var(--tint);font-weight:600;font-size:14px;min-width:0}
.sortwrap select{border:0;background:transparent;color:var(--tint);font-weight:600;font-size:14px;appearance:none;-webkit-appearance:none;outline:none;cursor:pointer;min-width:0}
.vseg{width:132px;flex:none}.vseg button{display:grid;place-items:center;color:var(--label2)}.vseg button[aria-pressed="true"]{color:var(--label)}
.art{position:absolute;inset:0}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5%}
.dexbar{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.dexbar .t{display:flex;justify-content:space-between;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}.dexbar .t b{color:var(--label);font-size:15px}
.meter{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--tint),#ff8fab);border-radius:4px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dx{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--photo);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.dx:not(.own):not(.wished) .art{filter:grayscale(1);opacity:.4}
.dx .no{position:absolute;left:6px;bottom:4px;font-size:10px;font-weight:700;color:#8e8e93;font-variant-numeric:tabular-nums}
.dx .ico{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.15);color:#1c1c1e}
.dx .ico.w{color:#ff2d55}.dx .ico svg.i{width:13px;height:13px}
.listv{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.lrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px;position:relative;cursor:pointer}
.lrow + .lrow::before{content:"";position:absolute;top:0;left:88px;right:0;border-top:.5px solid var(--sep)}
.lth{position:relative;width:64px;height:64px;border-radius:10px;background:var(--photo);overflow:hidden;box-shadow:inset 0 0 0 .5px var(--sep)}
.lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.lt .cn{font-size:14px}.lt .cp{font-size:15px}
.lrk{color:var(--tint);font-weight:700;margin-right:4px}
.qbs{display:flex;gap:6px}
.qb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--label)}
.qb.heart{background:var(--tint-soft);color:var(--tint)}.qb.spear{background:var(--label);color:var(--bg)}.qb.shield{background:var(--green-soft);color:var(--green)}
.qb svg.i{width:17px;height:17px}
.lst{font-size:11px;font-weight:700;padding:2px 7px;border-radius:9px;background:var(--fill);color:var(--label2);align-self:flex-start}
.lst.bought{background:var(--label);color:var(--bg)}.lst.wish{background:var(--tint-soft);color:var(--tint)}.lst.pass{background:var(--green-soft);color:var(--green)}
.spr{position:absolute;inset:5%;background-repeat:no-repeat;background-size:1000% 1000%}
.mbox{grid-column:1/-1;background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}.mbox b{color:#e5484d;font-size:17px}.mbox span{font-size:13px}.mbox small{font-size:11.5px;color:var(--label2)}
.mkt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mkt:empty{display:none}
.mb{height:44px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--label);font-size:14px;font-weight:600;text-decoration:none;box-shadow:inset 0 0 0 1px var(--sep)}
.lineup{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:14px;padding:14px}
.lh{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}.lh span{font-size:12px;color:var(--label2)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.lc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.lb{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--cc);overflow:hidden}
.lc.cur .lb{outline:2.5px solid var(--label);outline-offset:2px}
.lc:not(.own):not(.cur) .art{opacity:.85}
.lo{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:#1c1c1e}.lo.w{color:#ff2d55}.lo svg.i{width:12px;height:12px}
.ll{font-size:11.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.lc.cur .ll{color:var(--label);font-weight:700}
.av{--sz:22px;width:var(--sz);height:var(--sz);flex:none;border-radius:50%;background:conic-gradient(var(--cc) calc(var(--p)*1%),var(--fill2) 0);display:grid;place-items:center;padding:calc(var(--sz)*.1)}
.av img.face{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 calc(var(--sz)*.05) var(--card)}
.scroll.sers .pill{height:30px;font-size:13px}
.av i{width:100%;height:100%;border-radius:50%;background:var(--cc);color:#fff;font-style:normal;font-weight:800;font-size:calc(var(--sz)*.42);display:grid;place-items:center;box-shadow:0 0 0 calc(var(--sz)*.05) var(--card)}
.pill .av{margin-left:-8px}
.pg{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.pgt{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;font-variant-numeric:tabular-nums}
.pgt > b{font-size:17px}.pgt > span{font-size:13px;color:var(--label2)}.pgt > span b{color:var(--label);font-size:15px}
.meter.big{height:10px;border-radius:5px}.pg .meter i{background:var(--cc)}
.pgs{font-size:12px!important}
.mp{font-size:12px;font-weight:700;color:#e5484d;font-variant-numeric:tabular-nums}.mp small{font-weight:500;color:var(--label2);margin-left:4px}
.pill .pc{font-size:11px;font-weight:700;color:var(--tint);margin-left:2px}.pill[aria-pressed="true"] .pc{color:inherit;opacity:.8}
.ja{font-size:12px;color:var(--label2);text-align:center;margin:-10px 0 0;overflow-wrap:anywhere}
.so{color:#ff3b30;font-weight:600}

.ab:active{opacity:.6}

.empty{background:var(--card);border-radius:16px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:var(--shadow)}
.empty .ei{width:52px;height:52px;border-radius:50%;background:var(--tint-soft);color:var(--tint);display:grid;place-items:center}
.empty h3{font-size:17px;font-weight:700;margin:4px 0 0}
.empty p{margin:0;color:var(--label2);font-size:14px;max-width:34ch}
.plain-btn{height:40px;padding:0 16px;border-radius:10px;color:var(--tint);font-size:15px;font-weight:600}
.foot{font-size:12px;color:var(--label3);text-align:center;margin:4px 0 0}

/* 하단 탭바 (폰) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;color:#999;font-size:10.5px;font-weight:600;position:relative}
.tab[aria-current="page"]{color:var(--tint)}
.tab svg.i{width:26px;height:26px}
.tab .badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--tint);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* ───── PC: macOS 창 ───── */
@media (min-width:900px){
  /* PC = 굿즈샵 웹사이트: 상단 고정 헤더(로고+보관함 탭) + 가운데 넓은 본문 */

:root{--cream:#fffaf3;--dot:rgba(255,138,173,.16);--pink:#ff6b9a;--pink2:#ffe3ec;--pink3:#fff0f5;--mint:#e3f7ee;--lemon:#fff5d6;--lav:#efe9ff;--brown:#6b4f45;--edge:#ffd9e5;

body{background-color:var(--cream);background-image:radial-gradient(var(--dot) 2.2px,transparent 2.8px);background-size:24px 24px;letter-spacing:0}

<div class="overlay" id="uOverlay" hidden>

<div class="toast" id="toast" hidden></div>

<script>
/* ===== 저장소 + 로그인 (브라우저 저장, Supabase 로그인 시 계정 동기화) ===== */
(function(){
const CFG=window.DOGAM_CONFIG||{};
const LS="wishdogam-store-v2", RATE_LS="wishdogam-rate-v1";
const hasSB=!!(CFG.supabaseUrl&&CFG.supabaseKey);
let store=null; // {wishes:{id:doc}}
try{store=JSON.parse(localStorage.getItem(LS))}catch(e){}
const subs=new Set();
let sb=null, session=null, pushT=null, syncState="";

function persist(){try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){toastSafe("브라우저 저장 공간이 꽉 찼어요")}}
function toastSafe(m){try{toast(m)}catch(e){}}
function snap(){const docs=Object.values(store.wishes).filter(d=>!d._deleted).map(d=>({id:d.id,data:()=>d}));return {docs,metadata:{fromCache:false}}}
function emit(){const s=snap();subs.forEach(f=>{try{f(s)}catch(e){console.error(e)}})}
function changed(){persist();emit();schedulePush()}
const genId=()=>"my-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

async function seed(){
  if(store&&store.wishes)return;
  store={wishes:{}};
  try{((window.DOGAM_DATA||{}).extra||[]).forEach(d=>{store.wishes[d.id]={...d,_t:0}})}catch(e){}
  persist();
}
const ready=seed();

const db={
  collection(){return {
    doc(id){return {
      async set(o){store.wishes[id]={...o,id,_t:Date.now()};changed()},
      async update(o){const cur=store.wishes[id]||{id};store.wishes[id]={...cur,...o,id,_t:Date.now()};changed()},
      async delete(){if(store.wishes[id]){store.wishes[id]={id,_deleted:true,_t:Date.now()};changed()}}
    }},
    async add(o){const id=genId();store.wishes[id]={...o,id,_t:Date.now()};changed();return {id}},
    onSnapshot(f){subs.add(f);setTimeout(()=>f(snap()),0);return()=>subs.delete(f)}
  }},
  doc(){return {onSnapshot(f){
    let r=null;try{r=JSON.parse(localStorage.getItem(RATE_LS))}catch(e){}
    const give=v=>f({exists:!!v,data:()=>v||{}});
    give(r);
    const today=new Date().toISOString().slice(0,10);
    if(!r||r.day!==today){
      fetch("https://open.er-api.com/v6/latest/KRW").then(x=>x.json()).then(j=>{
        if(!j||!j.rates)return;
        const v={jpyRate:+(1/j.rates.JPY).toFixed(2),cnyRate:+(1/j.rates.CNY).toFixed(1),rateDate:today.replace(/-/g,"."),day:today};
        try{localStorage.setItem(RATE_LS,JSON.stringify(v))}catch(e){}
        give(v);
      }).catch(()=>{});
    }
    return()=>{};
  }}}
};

/* 사진: 작게 줄여서 글자(data URL)로 저장 */
const assets={async upload(file){
  const url=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(file)});
  const img=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url});
  const m=Math.min(1,600/Math.max(img.width,img.height));const c=document.createElement("canvas");
  c.width=Math.round(img.width*m);c.height=Math.round(img.height*m);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return {id:c.toDataURL("image/jpeg",.82)};
}};

window.claude={use:async k=>{await ready;return k==="db"?db:k==="assets"?assets:k==="user"?{can:async()=>true}:null}};

/* ---------- 계정 동기화 (Supabase) ---------- */
function mergeIn(remote){
  let n=0;
  for(const [id,d] of Object.entries(remote||{})){
    const cur=store.wishes[id];
    if(!cur||(d._t||0)>(cur._t||0)){store.wishes[id]=d;n++}
  }
  return n;
}
async function pull(){
  if(!sb||!session)return;
  setSync("동기화 중…");
  const {data,error}=await sb.from("dogam").select("data").eq("user_id",session.user.id).maybeSingle();
  if(error){setSync("동기화 실패: "+error.message);return}
  mergeIn(data&&data.data&&data.data.wishes);
  persist();emit();
  await push();
}
async function push(){
  if(!sb||!session)return;
  const {error}=await sb.from("dogam").upsert({user_id:session.user.id,data:{wishes:store.wishes},updated_at:new Date().toISOString()});
  setSync(error?"저장 실패: "+error.message:"계정에 저장됨 · "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}));
}
function schedulePush(){if(!session)return;clearTimeout(pushT);setSync("저장 대기 중…");pushT=setTimeout(push,1200)}
function setSync(t){syncState=t;const el=document.getElementById("uSync");if(el)el.textContent=t}

async function initSB(){
  if(!hasSB)return;
  if(!window.supabase){await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)}).catch(()=>{})}
  if(!window.supabase)return;
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);
  const {data}=await sb.auth.getSession();session=data.session;
  sb.auth.onAuthStateChange((_e,s)=>{const was=session&&session.user.id;session=s;userUi();if(s&&s.user.id!==was){ready.then(pull)}});
  userUi();
  if(session)ready.then(pull);
  else{let later=null;try{later=sessionStorage.getItem("dogam-later")}catch(_){}if(!later)openUser()}
}

/* ---------- 로그인 화면 ---------- */
const $u=id=>document.getElementById(id);
function userUi(){
  const b=$u("userBtn");if(b)b.classList.toggle("on",!!session);
  const B=$u("uBody");if(!B||$u("uOverlay").hidden)return;
  const backup=`<details class="ubk"><summary>백업 파일로 저장하기</summary><div class="ubtns"><button type="button" class="ubtn ghost" id="uExport">백업 내려받기</button><label class="ubtn ghost">백업 불러오기<input type="file" id="uImport" accept="application/json" hidden></label></div></details>`;
  if(!hasSB){
    B.innerHTML=`<div class="uhead"><div class="uav">${ic("user")}</div><h3>이 브라우저에 저장 중</h3><p>지금은 기록이 이 브라우저에만 저장돼요.<br>로그인 기능은 <b>설명서.txt 3단계</b>(Supabase 연결)를 하면 켜져요.</p></div>`+backup;
  }else if(!session){
    B.innerHTML=`<div class="uhead"><div class="uav big">${AV&&AV["치이카와"]?`<img src="${AV["치이카와"]}" alt="">`:ic("user")}</div><h3>치이카와 위시 도감</h3><p>로그인하면 폰·PC 어디서든<br>내 위시·토벌 기록을 같이 볼 수 있어요.</p></div>
      <form class="ubox" id="uForm"><input id="uEmail" type="email" placeholder="이메일" required autocomplete="email"><input id="uPw" type="password" placeholder="비밀번호 (6자 이상)" required minlength="6" autocomplete="current-password">
      <p class="uerr" id="uErr" hidden></p>
      <div class="ubtns"><button type="submit" class="ubtn">로그인</button><button type="button" class="ubtn ghost" id="uSignup">회원가입</button></div>
      <button type="button" class="ulink" id="uLater">로그인 없이 둘러보기</button></form>`+backup;
  }else{
    B.innerHTML=`<div class="uhead"><div class="uav on">${ic("user")}</div><h3>${esc(session.user.email||"")}</h3><p id="uSync">${esc(syncState||"계정에 저장됨")}</p></div>
      <div class="ubox"><div class="ubtns"><button type="button" class="ubtn ghost" id="uSyncNow">지금 동기화</button><button type="button" class="ubtn ghost" id="uLogout">로그아웃</button></div></div>`+backup;
  }
}
function openUser(){$u("uOverlay").hidden=false;userUi()}
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("#userBtn"))return openUser();
  if(t.closest("#uLater")){$u("uOverlay").hidden=true;try{sessionStorage.setItem("dogam-later","1")}catch(_){}return}
  if(t.id==="uOverlay"||t.closest("#uClose")){$u("uOverlay").hidden=true;return}
  if(t.closest("#uSignup")){const em=$u("uEmail").value.trim(),pw=$u("uPw").value;const er=$u("uErr");
    if(!em||pw.length<6){er.hidden=false;er.textContent="이메일과 6자 이상 비밀번호를 넣어 주세요.";return}
    const {data,error}=await sb.auth.signUp({email:em,password:pw});
    er.hidden=false;er.textContent=error?error.message:(data.session?"가입 완료!":"가입 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.");return}
  if(t.closest("#uLogout")){await sb.auth.signOut();session=null;try{localStorage.removeItem(LS)}catch(_){}store={wishes:{}};await (async()=>{((window.DOGAM_DATA||{}).extra||[]).forEach(d=>{store.wishes[d.id]={...d,_t:0}});persist();emit()})();userUi();toastSafe("로그아웃했어요");return}
  if(t.closest("#uSyncNow")){await pull();return}
  if(t.closest("#uExport")){const blob=new Blob([JSON.stringify({app:"wishdogam",at:Date.now(),wishes:store.wishes})],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`치이카와도감-백업-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="uForm")return;e.preventDefault();
  const er=$u("uErr");er.hidden=true;
  const {error}=await sb.auth.signInWithPassword({email:$u("uEmail").value.trim(),password:$u("uPw").value});
  if(error){er.hidden=false;er.textContent=/Invalid login/i.test(error.message)?"이메일이나 비밀번호가 맞지 않아요.":/confirm/i.test(error.message)?"가입 메일의 링크를 먼저 눌러 주세요.":error.message}
  else toastSafe("로그인했어요");
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="uImport")return;const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());if(!j.wishes)throw 0;for(const [id,d] of Object.entries(j.wishes)){store.wishes[id]={...d,_t:Math.max(d._t||0,1)}}changed();toastSafe("백업을 불러왔어요")}
  catch(err){toastSafe("백업 파일이 아니에요")}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$u("uOverlay"))$u("uOverlay").hidden=true});
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initSB);else initSB();
})();

</script>
<script>

function match(i,skip){
  if(state.status!=="all"&&i.status!==state.status&&!KEEP.has(i.id))return false;
  if(skip!=="shop"&&state.shop!=="all"&&(i.shop||"직접 추가")!==state.shop)return false;

}

const ring=(n,p,sz)=>`<span class="av" style="--cc:${CH_COLOR[n]||"#ff2d55"};--p:${p};--sz:${sz}px">${AV[n]?`<img class="face" src="${AV[n]}" alt="">`:`<i>${n==="all"?"전":esc(n.slice(0,1))}</i>`}</span>`;
function charProg(n){const a=n==="all"?state.items:state.items.filter(i=>i.character===n);const b=a.filter(i=>i.status==="bought").length;const w=a.filter(i=>i.status==="wish").length;return {a,b,w,t:a.length,p:a.length?b/a.length*100:0}}
function pgCard(){const n=state.char;const g=charProg(n);const pc=g.p<1&&g.b?g.p.toFixed(1):Math.round(g.p);
  return `<div class="pg" style="--cc:${CH_COLOR[n]||"#ff2d55"}">${ring(n,g.p,52)}<div class="pgt"><b>${n==="all"?"치이카와 친구들":esc(n)} 도감</b><span><b>${g.b}</b> / ${g.t}개 토벌 · ${pc}%</span><div class="meter big"><i style="width:${Math.max(g.p,g.b?1.5:0)}%"></i></div><span class="pgs">위시 ${g.w} · 남은 ${g.t-g.b}</span></div></div>`}
function dexCell(i){
  const n=dexNo.get(i.id)||0;
  const ico=i.status==="bought"?`<span class="ico">${ic("spear","i")}</span>`:i.status==="wish"?`<span class="ico w">${ic("heart","i")}</span>`:i.status==="pass"?`<span class="ico" style="color:#248a3d">${ic("shield","i")}</span>`:"";
  return `<div class="dx ${i.status==="bought"?"own":""} ${i.status==="wish"?"wished":""}" data-id="${esc(i.id)}" tabindex="0" role="button" aria-label="${esc(i.name)}"><div class="art">${imgHtml(i)}</div>${ico}<span class="no">No.${String(n).padStart(3,"0")}</span></div>`;
}
function listRow(i){
  const n=dexNo.get(i.id)||0;
  const rk=state.sort==="pop"&&rankOf(i)<2?`<span class="lrk">${n}위</span>`:"";
  const stl={wish:"위시",bought:"토벌 완료",pass:"참음"}[i.status];
  let q="";
  if(!readOnly){
    if(i.status==="cand")q=`<button type="button" class="qb spear" data-act="bought" aria-label="토벌">${ic("spear","i")}</button><button type="button" class="qb hb" data-act="heart" aria-pressed="false" aria-label="위시에 담기">${ic("heart","i")}</button>`;
    else if(i.status==="wish")q=`<button type="button" class="qb cartq" data-act="cart" aria-pressed="${!!i.cart}" aria-label="장바구니">${ic("cart","i")}</button><button type="button" class="qb spear" data-act="bought" aria-label="토벌">${ic("spear","i")}</button>${state.status==="wish"?`<button type="button" class="qb shield" data-act="pass" aria-label="참음">${ic("shield","i")}</button>`:""}<button type="button" class="qb hb" data-act="heart" aria-pressed="true" aria-label="위시에서 빼기">${ic("heart","i")}</button>`;
    else q=`<button type="button" class="qb" data-act="undo" aria-label="${i.status==="bought"?"토벌 취소":"참음 취소"}">${ic("undo","i")}</button>`;
  }
  const meta=[i.released,i.shop].filter(Boolean).join(" · ")+soldTag(i);
  return `<div class="lrow" data-id="${esc(i.id)}" tabindex="0" role="button" aria-label="${esc(i.name)}"><div class="lth"><div class="art">${imgHtml(i)}</div></div>
    <div class="lt">${stl?`<span class="lst ${i.status}">${stl}</span>`:""}<span class="cn">${rk}${esc(i.name)}</span><span class="cp">${priceHtml(i)}</span>${mktHtml(i)}<span class="cm">${meta}</span></div><div class="qbs">${q}</div></div>`;
}
function render(){const m=document.querySelector(".main"),a=m?m.scrollTop:0,b=window.scrollY;_render();renderCart();if(m)m.scrollTop=a;window.scrollTo(0,b)}
function _render(){
  renderTop();renderFilters();
  const L=$("list");
  if(!state.loaded){L.innerHTML=`<div class="empty"><h3>${state.error?esc(state.error):"불러오는 중…"}</h3></div>`;return}

  db.doc("meta/settings").onSnapshot(s=>{const v=s.exists?s.data():{};if(v.jpyRate>0)RATES.JPY=v.jpyRate;if(v.cnyRate>0)RATES.CNY=v.cnyRate;if(v.rateDate)RATE_DATE=v.rateDate;rateText();render()},()=>{});
})();
</script>
