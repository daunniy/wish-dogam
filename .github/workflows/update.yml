name: 도감 자동 업데이트

on:
  schedule:
    - cron: "43 3 * * *"     # 매일 낮 12:43 (한국 시간) 전체 업데이트
    - cron: "13 9 * * *"     # 매일 저녁 6:13 (한국 시간) 재입고만 확인
  workflow_dispatch:          # Actions 탭에서 'Run workflow'로 바로 실행
  push:
    branches: [main]          # 내가 파일을 고치면 사이트에 바로 반영

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dogam
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 신상·빠진 상품 추가 + 메루카리 시세 + 재입고 갱신
        if: github.event_name != 'push' && github.event.schedule != '13 9 * * *'
        run: |
          pip install cryptography pillow
          python scripts/update.py

      - name: 재입고만 확인 (저녁)
        if: github.event.schedule == '13 9 * * *'
        run: |
          pip install cryptography pillow
          python scripts/update.py --restock

      - name: 사이트용 데이터 묶기
        if: github.event_name == 'push'
        run: python scripts/update.py --bundle-only

      - name: 바뀐 데이터 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "dogam-bot"
          git config user.email "dogam-bot@users.noreply.github.com"
          # bundle.js 는 매번 다시 만들어지니까 저장소에는 넣지 않음 (.gitignore)
          git rm --cached --quiet --ignore-unmatch data/bundle.js
          git add data .gitignore
          git diff --cached --quiet || git commit -m "도감 자동 업데이트 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
